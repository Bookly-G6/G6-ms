spring.application.name=bookly

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Bookly}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET:bookly-secret-key-change-me-to-a-strong-production-value-1234567890}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1